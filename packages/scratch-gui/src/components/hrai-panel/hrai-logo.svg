<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="hrai">
  <!--
    A speech bubble holding a play triangle.

    "hrai" is the Czech imperative *hraj* — "play!" — so the mark says the two things
    the tutor is: it talks, and it is about playing. Deliberately not Scratch-derived:
    no cat, no Scratch marks, and a silhouette that reads at 16px in a browser tab.
  -->
  <path fill="currentColor" d="M6 3h20a5 5 0 0 1 5 5v13a5 5 0 0 1-5 5H14.6l-6.1 4.7A1 1 0 0 1 7 30v-4H6a5 5 0 0 1-5-5V8a5 5 0 0 1 5-5z"/>
  <path fill="#fff" d="M13 9.4a1.2 1.2 0 0 1 1.83-1.02l7.2 4.6a1.2 1.2 0 0 1 0 2.04l-7.2 4.6A1.2 1.2 0 0 1 13 18.6z"/>
</svg>
