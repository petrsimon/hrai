events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # A literal upstream host is resolved once, while the config loads, so nginx refuses to start at
    # all whenever the tutor is down and takes the editor with it. Resolving through a variable
    # defers the lookup to each request, which serves the editor and answers 502 on the tutor's
    # routes instead. 127.0.0.11 is Docker's embedded DNS, which serves the Compose network.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        set $hrai_upstream http://hrai:8791;

        location /socket.io/ {
            proxy_pass $hrai_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 600s;
        }

        location /api/ {
            proxy_pass $hrai_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
