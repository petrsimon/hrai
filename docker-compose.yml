services:
  llama:
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-vulkan}
    command:
      - --hf-repo
      - ${HRAI_MODEL_REPOSITORY:-lmstudio-community/Qwen3.5-27B-GGUF:Q4_K_M}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --gpu-layers
      - "999"
      - --ctx-size
      - "8192"
      - --jinja
      - --reasoning
      - off
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"
    volumes:
      - ${LLAMA_CACHE_DIR:-llama-cache}:/root/.cache/llama.cpp
    restart: unless-stopped

  hrai:
    build:
      context: .
      dockerfile: docker/hrai.Dockerfile
    environment:
      HRAI_MODEL_BACKEND: llama.cpp
      HRAI_MODEL_HOST: http://llama:8080
      HRAI_EVAL_MODEL: ${HRAI_MODEL_NAME:-Qwen3.5-27B}
      HRAI_PORT: "8791"
    expose:
      - "8791"
    depends_on:
      - llama
    restart: unless-stopped

  editor:
    build:
      context: .
      dockerfile: docker/editor.Dockerfile
      args:
        HRAI_SERVER_URL: ${HRAI_SERVER_URL:-http://localhost:8080}
    ports:
      - "${EDITOR_PORT:-8080}:8080"
    depends_on:
      - hrai
    restart: unless-stopped

volumes:
  llama-cache:
