services:
  llama:
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-vulkan}
    command:
      - --hf-repo
      - ${HRAI_MODEL_REPOSITORY:-lmstudio-community/Qwen3.5-27B-GGUF:Q4_K_M}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --gpu-layers
      - "999"
      - --ctx-size
      - "8192"
      - --parallel
      - "1"
      - --no-mmproj
      - --jinja
      - --reasoning
      - off
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"
    volumes:
      - ${LLAMA_CACHE_DIR:-llama-cache}:/root/.cache/huggingface
    restart: unless-stopped

  whisper-model:
    image: alpine:3.22
    command:
      - sh
      - -c
      - >-
        if [ ! -s /models/${HRAI_STT_MODEL_FILE:-ggml-small.bin} ]; then
        wget -O /models/${HRAI_STT_MODEL_FILE:-ggml-small.bin}
        "${HRAI_STT_MODEL_URL:-https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin?download=true}";
        fi
    volumes:
      - whisper-model-cache:/models
    restart: "no"

  whisper:
    image: ${WHISPER_IMAGE:-ghcr.io/ggml-org/whisper.cpp:main}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        server=whisper-server;
        if command -v whisper-whisper-server >/dev/null 2>&1; then server=whisper-whisper-server; fi;
        exec "$$server" -m /models/${HRAI_STT_MODEL_FILE:-ggml-small.bin}
        --host 0.0.0.0 --port 8080
    volumes:
      - whisper-model-cache:/models:ro
    expose:
      - "8080"
    depends_on:
      whisper-model:
        condition: service_completed_successfully
    restart: unless-stopped

  hrai:
    build:
      context: .
      dockerfile: docker/hrai.Dockerfile
    environment:
      HRAI_MODEL_BACKEND: llama.cpp
      HRAI_MODEL_HOST: http://llama:8080
      HRAI_EVAL_MODEL: ${HRAI_MODEL_NAME:-Qwen3.5-27B}
      HRAI_STT_HOST: http://whisper:8080
      HRAI_PORT: "8791"
      HRAI_DATA_DIR: /data
    volumes:
      - hrai-data:/data
    expose:
      - "8791"
    depends_on:
      - llama
      - whisper
    restart: unless-stopped

  game-design-eval:
    profiles: [eval]
    build:
      context: .
      dockerfile: docker/hrai-eval.Dockerfile
    environment:
      HRAI_MODEL_BACKEND: llama.cpp
      HRAI_EVAL_HOST: http://llama:8080
      HRAI_EVAL_MODEL: ${HRAI_MODEL_NAME:-Qwen3.5-27B}
    depends_on:
      llama:
        condition: service_healthy

  editor:
    build:
      context: .
      dockerfile: docker/editor.Dockerfile
      args:
        HRAI_SERVER_URL: ${HRAI_SERVER_URL:-}
    ports:
      - "${EDITOR_PORT:-8080}:8080"
    depends_on:
      - hrai
    restart: unless-stopped

volumes:
  hrai-data:
  llama-cache:
  whisper-model-cache:
